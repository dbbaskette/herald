name: Verify source and packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: herald-ui/frontend/package-lock.json
      - name: Launcher entrypoint regressions
        run: python3 scripts/test-launch-entrypoints.py
      - name: Clean build, frontend regressions, Maven verify, and packaged asset comparison
        run: |
          browser_fixture="$(command -v google-chrome)"
          test -x "$browser_fixture"
          ./scripts/build.sh "-Dherald.browser.fixture-executable=$browser_fixture"
      - name: GenAI local and bound modes use the same packaged bot
        timeout-minutes: 8
        run: python3 smoke/genai-binding.py --jar herald-bot/target/herald-bot-0.4.1-SNAPSHOT.jar
